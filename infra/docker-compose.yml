services:
  postgres:
    image: postgres:16-alpine
    container_name: caregrove-postgres
    environment:
      POSTGRES_USER: caregrove
      POSTGRES_PASSWORD: caregrove
      POSTGRES_DB: caregrove
    ports:
      - "5433:5432"
    volumes:
      - caregrove_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caregrove -d caregrove"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  caregrove_pg:
