# One always-on web service serves the site and proxies /api to the API
# in the same container. Postgres stays up, so the free 30-day database is not used.
# A custom domain can be attached to caregrove later.
services:
  - type: web
    name: caregrove
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    branch: develop
    plan: 0.5c-512mb
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: caregrove-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: ALLOW_DEMO_PAYMENTS
        value: "false"
      - key: MONTHLY_PRICE_USD
        value: ""

databases:
  - name: caregrove-db
    plan: 0.1c-256mb
    databaseName: caregrove
    user: caregrove
